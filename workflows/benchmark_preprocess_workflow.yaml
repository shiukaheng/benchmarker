---
# WorkflowTemplate for MGS pipeline v2
# Six-stage pipeline: initializer -> normalizer -> sfm -> sfm_postprocessed -> splat -> finalizer
# NOTE: gs-train (splat) stage and finalizer stage are commented out for now
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: benchmark-preprocess
  namespace: material-gaussians
spec:
  entrypoint: pipeline

  arguments:
    parameters:
      - name: input_s3_file
        value: ""
      - name: output_s3_file
        value: ""

  # Use dedicated service account for workflow pods
  serviceAccountName: product-apps-workflow

  # PVC for shared data between stages
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3-immediate
        resources:
          requests:
            storage: 50Gi

  # Delete PVC after workflow completes (extended for debugging)
  ttlStrategy:
    secondsAfterCompletion: 86400  # 24 hours
    secondsAfterSuccess: 86400     # 24 hours
    secondsAfterFailure: 172800    # 48 hours

  templates:
    # Main pipeline with sequential steps
    - name: pipeline
      inputs:
        parameters:
          - name: input_s3_file
          - name: output_s3_file
      steps:
        # Stage 0: Download input from S3
        - - name: initializer
            template: initializer
            arguments:
              parameters:
                - name: input_s3_file
                  value: "{{inputs.parameters.input_s3_file}}"

        # Stage 1: Normalize input (video/archive/images -> JPEG frames)
        - - name: normalizer
            template: normalizer

        # Stage 2: SfM reconstruction
        - - name: sfm
            template: sfm

        # Stage 3: Postprocess SfM (da3, cutter, zoomer, scaler)
        - - name: sfm-postprocessed
            template: sfm-postprocessed

        # Stage 4: Finalizer - Archive and upload results
        - - name: finalizer
            template: finalizer
            arguments:
              parameters:
                - name: output_s3_file
                  value: "{{inputs.parameters.output_s3_file}}"

    # Stage 0: Initializer - Download input from S3
    - name: initializer
      inputs:
        parameters:
          - name: input_s3_file
      container:
        image: "amazon/aws-cli:latest"
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
          - |
            mkdir -p /workspace/input && \
            aws s3 cp "{{inputs.parameters.input_s3_file}}" /workspace/input/
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: 512Mi
            cpu: "500m"
          limits:
            memory: 1Gi

    # Stage 1: Normalizer - Convert input to JPEG frames
    - name: normalizer
      container:
        image: "223952452436.dkr.ecr.eu-west-2.amazonaws.com/m-xr/material-gaussians-mgs-normalizer:benchmark-latest"
        imagePullPolicy: IfNotPresent
        command: ["/root/.local/bin/uv", "run", "--no-sync", "--python-platform", "linux", "mgs-normalizer"]
        env:
          - name: INPUT_DIR
            value: /workspace/input
          - name: OUTPUT_DIR
            value: /workspace/normalized
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: 2Gi
            cpu: "1"
          limits:
            memory: 4Gi

    # Stage 2: SfM reconstruction (needs GPU for feature extraction acceleration)
    - name: sfm
      nodeSelector:
        workload-type: gpu
      container:
        image: "223952452436.dkr.ecr.eu-west-2.amazonaws.com/m-xr/material-gaussians-sfm:benchmark-latest"
        imagePullPolicy: IfNotPresent
        command: ["/entrypoint.sh", "/root/.local/bin/uv", "run", "--no-sync", "--python-platform", "linux", "sfm"]
        env:
          - name: INPUT_DIR
            value: /workspace/normalized
          - name: OUTPUT_DIR
            value: /workspace/sfm
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: 8Gi
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: 16Gi
            nvidia.com/gpu: "1"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

    # Stage 3: Postprocess SfM (requires GPU for DA3 depth estimation)
    - name: sfm-postprocessed
      nodeSelector:
        workload-type: gpu
      container:
        image: "223952452436.dkr.ecr.eu-west-2.amazonaws.com/m-xr/material-gaussians-postprocess-sfm:benchmark-latest"
        imagePullPolicy: IfNotPresent
        command: ["/entrypoint.sh", "/root/.local/bin/uv", "run", "--no-sync", "--python-platform", "linux", "postprocess-sfm"]
        env:
          - name: INPUT_DIR
            value: /workspace/sfm
          - name: OUTPUT_DIR
            value: /workspace/sfm_postprocessed
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: 16Gi
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: 32Gi
            nvidia.com/gpu: "1"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

    # Stage 4: Finalizer - Archive sfm_postprocessed and upload to S3
    - name: finalizer
      inputs:
        parameters:
          - name: output_s3_file
      container:
        image: "amazon/aws-cli:latest"
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
          - |
            yum install -y zip && \
            cd /workspace && \
            zip -r sfm_postprocessed.zip sfm_postprocessed/ && \
            aws s3 cp sfm_postprocessed.zip "{{inputs.parameters.output_s3_file}}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: 512Mi
            cpu: "500m"
          limits:
            memory: 2Gi